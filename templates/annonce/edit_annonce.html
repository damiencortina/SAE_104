{% extends 'layout.html' %}

{% block header %}
    <div class="px-4 py-5 my-5 text-center">
        <h1 class="display-5">Modifier l'annonce : <strong></strong></h1>
    </div>
{% endblock header %}

{% block body %}
    <form action="/annonce/edit" method="post">
        <input type="hidden" name="maraicher_id" value="{{ annonce.maraicher_id }}">
        <input type="hidden" name="produit_id" value="{{ annonce.produit_id }}">
        <input type="hidden" name="unite_id" value="{{ annonce.unite_id }}">
        <input type="hidden" name="vente_id" value="{{ annonce.vente_id }}">
        <div class="mb-3">
            <label for="quantiteVendue" class="form-label">Prix d'achat(€)</label>
            <input type="number" class="form-control" id="quantiteVendue" name="quantite_vendue"
                   placeholder="Saisir une quantité vendue" value="{{ annonce.quantite_vendue }}">
        </div>
        <div class="mb-3">
            <label for="prixProduit" class="form-label">Prix location(€)</label>
            <input type="number" class="form-control" id="prixProduit" name="prix_produit"
                   placeholder="Saisir le prix auquel vous souhaitez annoncer le produit"
                   value="{{ annonce.prix_produit }}">
        </div>
        <button type="submit" class="btn btn-primary">Valider</button>
    </form>
{% endblock body %}
