<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter un produit</title>
    <link rel="stylesheet" href="/static/bootstrap/bootstrap.css">
</head>
<body class="bg-light">
{% include '_nav.html' %}

<div class="container py-4">
    <h2 class="mb-4">Ajouter un produit</h2>

    <form action="/produit/add" method="post">

        <div class="mb-3">
            <label for="nom" class="form-label">Nom du produit</label>
            <input type="text" class="form-control" id="nom" name="nom" required>
        </div>

        <div class="mb-3">
            <label for="type_id" class="form-label">Type de produit</label>
            <select class="form-select" id="type_id" name="type_id" required>
                <option value="">-- Sélectionner un type --</option>
                {% for t in types_produit %}
                    <option value="{{ t.id }}">{{ t.libelle }} ({{ t.id }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="saison_id" class="form-label">Saison de pousse</label>
            <select class="form-select" id="saison_id" name="saison_id" required>
                <option value="">-- Choisir une saison --</option>
                {% for s in saisons %}
                    <option value="{{ s.id }}">{{ s.libelle }} ({{ s.id }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="prix" class="form-label">Prix conseillé (€)</label>
            <input type="number" class="form-control" id="prix" name="prix">
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="/produit/show" class="btn btn-secondary">Annuler</a>
    </form>
</div>

</body>
</html>
