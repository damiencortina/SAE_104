{% extends 'layout.html' %}

{% block header %}
    <div class="px-4 py-5 text-center">
        <h1 class="display-5">Modifier des ventes </h1>
    </div>
{% endblock header %}
{% block body %}
<a href="/vente/show" class="btn btn-secondary">Retour à la liste des ventes</a>
<div class="container py-4">
  <h2 class="mb-4">Modifier la vente</h2>
  <form action="/vente/edit" method="post">
    <!-- Champ caché ID -->
    <input type="hidden" name="id" value="{{ vente.id }}">

    <!-- Date de vente -->
    <div class="mb-3">
      <label for="date_vente" class="form-label">Date de vente</label>
      <input type="date" class="form-control" id="date_vente" name="date_vente" value="{{ vente.date_vente }}">
    </div>

  <!-- Heure de début -->
    <div class="mb-3">
      <label for="heure_debut" class="form-label">Heure de début</label>
      <input type="time" class="form-control" id="heure_debut" name="heure_debut" value="{{ vente.heure_debut }}">
    </div>

  <!-- Heure de fin -->
    <div class="mb-3">
      <label for="heure_fin" class="form-label">Heure de fin</label>
      <input type="time" class="form-control" id="heure_fin" name="heure_fin" value="{{ vente.heure_fin }}">
    </div>



    <!-- Point de vente -->
    <div class="mb-3">
      <label for="id_pdv" class="form-label">Point de vente</label>
      <select name="id_pdv" class="form-control" id="id_pdv">
        {% for ptdeVente in ptdeVente %}
            <option value="{{ ptdeVente.id }}"
                {% if ptdeVente.id is defined and ptdeVente.id == vente.id_pdv %}selected{% endif %}
        > {{ ptdeVente.nom_point_de_vente }} </option>
        {% endfor %}
    </select>
    </div>

    <!-- Boutons -->
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <button type="reset" class="btn btn-secondary">Réinitialiser</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
