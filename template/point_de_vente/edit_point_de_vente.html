{% extends 'layout.html' %}

{% block title %}
 <title>Gestion des Points de Vente</title>
{% endblock %}

{% block body %}
<div class="container py-4">
 <h2 class="mb-4">Modifier un point de vente</h2>
 <form action="/point_de_vente/valide_edit?id={{ point_de_vente.id_point_de_vente }}" method="post">

 <div class="mb-3">
 <label for="nom_point_de_vente" class="form-label">Nom du point de vente</label>
 <input type="text" class="form-control" id="nom_point_de_vente" name="nom_point_de_vente" value="{{ point_de_vente.nom_point_de_vente }}" required>
 </div>

 <div class="mb-3">
 <label for="adresse_point_de_vente" class="form-label">Adresse</label>
 <input type="text" class="form-control" id="adresse_point_de_vente" name="adresse_point_de_vente" value="{{ point_de_vente.adresse_point_de_vente }}" required>
 </div>

 <div class="mb-3">
 <label for="code_postal_point_de_vente" class="form-label">Code postal</label>
 <input type="text" class="form-control" id="code_postal_point_de_vente" name="code_postal_point_de_vente" value="{{ point_de_vente.code_postal_point_de_vente }}" maxlength="5" required>
 </div>

 <div class="mb-3">
 <label for="ville_id" class="form-label">Ville</label>
 <select class="form-control" name="ville_id" id="ville_id" required>
 <option value="">Sélectionner une ville</option>
 {% for ville in villes %}
 <option value="{{ ville.id_ville }}" {% if ville.id_ville == point_de_vente.ville_id %}selected{% endif %}>
 {{ ville.nom_ville }}
 </option>
 {% endfor %}
 </select>
 </div>

 <div class="mb-3">
 <label for="tarifs_location" class="form-label">Tarifs de location</label>
 <input type="number" class="form-control" id="tarifs_location" name="tarifs_location" value="{{ point_de_vente.tarifs_location }}" required>
 </div>

 <button type="submit" class="btn btn-primary">Enregistrer</button>
 <a href="/point_de_vente/show" class="btn btn-secondary">Annuler</a>
 </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
